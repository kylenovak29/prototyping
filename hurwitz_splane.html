  const dpr=Math.min(window.devicePixelRatio||1,glReady?(lowRes?1:1.55):1), maxW=glReady?(lowRes?550:1120):500,maxH=glReady?(lowRes?570:1000):680;

  const ar=Math.round(state.centerX),ai=Math.round(state.centerY),u=p.u;

  const px=2*HALF_HEIGHT*Math.pow(10,-state.zoom)/canvas.height;
  const baseX=atlas.w/2+(state.centerX-atlas.cx)/atlas.pitch,baseY=atlas.h/2+(state.centerY-atlas.cy)/atlas.pitch;
  const scal=px/atlas.pitch,left=baseX-canvas.width*scal/2,right=baseX+canvas.width*scal/2;
  const low=baseY-canvas.height*scal/2,high=baseY+canvas.height*scal/2;
  return left>=0&&right<=atlas.w&&low>=0&&high<=atlas.h;
 }
 function renderAtlas(){const g=gl,p=glAtlas,u=p.u;
  const px=2*HALF_HEIGHT*Math.pow(10,-state.zoom)/canvas.height;
  const x=atlas.w/2+(state.centerX-atlas.cx)/atlas.pitch,y=atlas.h/2+(state.centerY-atlas.cy)/atlas.pitch;
  g.useProgram(p.program);g.viewport(0,0,canvas.width,canvas.height);
  g.uniform2f(u.resolution,canvas.width,canvas.height);g.uniform2f(u.srcCenter,x,y);g.uniform2f(u.srcResolution,atlas.w,atlas.h);
  g.uniform2f(u.poleOrigin,state.centerX-1,state.centerY);g.uniform1f(u.srcScale,px/atlas.pitch);g.uniform1f(u.srcPitch,atlas.pitch);g.uniform1f(u.currentPitch,px);

 function renderCPU(){const id=++cpuToken,ctx=ctx2d||(ctx2d=canvas.getContext('2d',{alpha:false}));if(!ctx)return;
  const snap={...state},w=Math.min(canvas.width,lowRes?210:500),h=Math.round(canvas.height*w/canvas.width),work=document.createElement('canvas');work.width=w;work.height=h;
  const cg=work.getContext('2d',{alpha:false}),data=cg.createImageData(w,h),pixels=data.data;
  const pitch=2*HALF_HEIGHT*Math.pow(10,-snap.zoom)/h;let yy=0;
  function rows(){if(id!==cpuToken||stopped)return;const start=performance.now();
   while(yy<h&&performance.now()-start<10){for(let xx=0;xx<w;xx++){
    const s={re:snap.centerX+(xx+.5-w/2)*pitch,im:snap.centerY+(h/2-yy-.5)*pitch};
    const value=CORE.zeta(s,snap.a),rgb=shadeCPU(value,snap.mode),k=(yy*w+xx)*4;

   while(i<count&&performance.now()-t0<11){

// Hurwitz numerical core v3. Complex s with Re s in [-2,4.5], Im s in [-2,2], excluding s = 1.
// Euler–Maclaurin + recurrence; standalone, reusable point evaluator.
const HurwitzCore = (() => {
 const Bernoulli=[1/6,-1/30,1/42,-1/30,5/66,-691/2730,7/6,-3617/510];
 const em=Bernoulli.map((b,j)=>{let q=1;for(let k=2;k<=2*j+2;k++)q*=k;return b/q;});
 const C=(re,im=0)=>({re,im});
 const add=(a,b)=>C(a.re+b.re,a.im+b.im);
 const sub=(a,b)=>C(a.re-b.re,a.im-b.im);
 const scale=(a,c)=>C(c*a.re,c*a.im);
 const mul=(a,b)=>C(a.re*b.re-a.im*b.im,a.re*b.im+a.im*b.re);
 const inv=a=>{const d=a.re*a.re+a.im*a.im;return C(a.re/d,-a.im/d);};
 const div=(a,b)=>mul(a,inv(b));
 function ipow(a,n){let z=C(1),w=a;for(let j=0;j<n;j++)z=mul(z,w);return z;}
 function isRealInteger(s){return Math.abs(s.im)<=1e-12 && Math.abs(s.re-Math.round(s.re))<=1e-12;}
 function powMinus(a,s){
   if(isRealInteger(s) && s.re>0 && s.re<=8)return ipow(inv(a),Math.round(s.re));
   const r=Math.max(Math.hypot(a.re,a.im),1e-300),theta=Math.atan2(a.im,a.re);
   const mag=Math.exp(-s.re*Math.log(r)+s.im*theta);
   const phase=-s.im*Math.log(r)-s.re*theta;
   return C(mag*Math.cos(phase),mag*Math.sin(phase));
 }
 function bernoulliValue(s,z){
   if(Math.abs(s.im)>1e-12)return null;
   if(s.re===0)return C(0.5-z.re,-z.im);
   const z2=mul(z,z);
   if(s.re===-1)return scale(add(add(z2,scale(z,-1)),C(1/6)),-0.5);
   const z3=mul(z2,z);
   if(s.re===-2)return scale(add(add(z3,scale(z2,-1.5)),scale(z,0.5)),-1/3);
   return null;
 }
 function hurwitzZeta(s,z){
   if(!Number.isFinite(s.re)||!Number.isFinite(s.im)||s.re<-2||s.re>32||Math.abs(s.im)>2||(!s.im&&s.re===1)||!Number.isFinite(z.re)||!Number.isFinite(z.im))throw new RangeError('Expected complex s in range and finite complex z');
   const exact=bernoulliValue(s,z);
   if(exact)return exact;
   const target=s.re<1?10:18;
   const N=Math.max(0,Math.ceil(target-z.re)),w=C(z.re+N,z.im);
   const inverseW=inv(w),inverseW2=mul(inverseW,inverseW);
   let result=add(div(powMinus(w,C(s.re-1,s.im)),C(s.re-1,s.im)),scale(powMinus(w,s),0.5));
   let rising=C(s.re,s.im),power=powMinus(w,C(s.re+1,s.im));
   for(let j=1;j<=8;j++){
     result=add(result,scale(mul(rising,power),em[j-1]));
     power=mul(power,inverseW2);
     rising=mul(rising,C(s.re+2*j-1,s.im));
     rising=mul(rising,C(s.re+2*j,s.im));
   }
   for(let k=0;k<N;k++)result=add(result,powMinus(C(z.re+k,z.im),s));
   return result;
 }
 // Taylor coefficients in z: a_k=(-1)^k(s)_k/k! * zeta(s+k,z0).
 // Coefficients are computed in JS double precision, not WebGL float.
 function taylorCoefficients(s,z0,degree=18){
   const out=[];
   let multiplier=C(1);
   for(let k=0;k<=degree;k++){
     const zk=hurwitzZeta(C(s.re+k,s.im),z0);
     out.push(mul(multiplier,zk));
     multiplier=mul(multiplier,scale(C(s.re+k,s.im),-1/(k+1)));
   }
   return out;
 }
 function evalTaylor(coeff, delta){
   let v=coeff[coeff.length-1];
   for(let j=coeff.length-2;j>=0;j--)v=add(coeff[j],mul(v,delta));
   return v;
 }
 function evaluate(s,z){
   const orderPole=Math.abs(s.re-1)<=1e-12&&Math.abs(s.im)<=1e-12;
   if(orderPole)return {kind:'order-pole'};
   const n=Math.round(z.re),singular=n<=0&&Math.abs(z.re-n)<=1e-13&&Math.abs(z.im)<=1e-13;
   const integerReal=isRealInteger(s);
   const entire=integerReal && (s.re===0||s.re===-1||s.re===-2);
   if(singular && integerReal && s.re>0)return {kind:'pole'};
   if(singular && !entire)return {kind:'branch-point'};
   if(!entire && !integerReal && z.re<0 && Math.abs(z.im)<=1e-13)return {kind:'branch-cut'};
   const value=hurwitzZeta(s,z),abs=Math.hypot(value.re,value.im);
   return {kind:'finite',...value,logAbs:Math.log(abs),arg:Math.atan2(value.im,value.re)};
 }
 return {C,add,sub,scale,mul,inv,div,powMinus,bernoulliValue,hurwitzZeta,evaluate,isRealInteger,taylorCoefficients,evalTaylor};
})();

// Shared reader interface. Each renderer retains independent numerical and viewport state.
(() => {
  const root=document.getElementById('unified'),paneZ=document.getElementById('u-pane-z'),paneS=document.getElementById('u-pane-s');
  const zRoot=paneZ.querySelector('.pg-explorer'),sRoot=paneS.querySelector('.hzs');
  const zMarks=zRoot.querySelector('.pg-markings-toggle'),sMarks=sRoot.querySelector('.hzs-mark-toggle');
  const zModes=[...zRoot.querySelectorAll('.hz-mode')],sModes=[...sRoot.querySelectorAll('.hzs-mode')];
  const snapButton=zRoot.querySelector('.hz-snap');
  const menu=document.getElementById('u-menu'),settings=document.getElementById('u-settings-button'),markings=document.getElementById('u-mark'),snap=document.getElementById('u-snap');
  let active='z';
  function setMarkings(checked){
   markings.checked=checked;
   for(const input of [zMarks,sMarks]){input.checked=checked;input.dispatchEvent(new Event('change',{bubbles:true}));}
  }
  function setColor(mode){
   root.classList.remove('u-combined','u-phase','u-modulus');root.classList.add('u-'+mode);
   for(const [rootNode,btns] of [[zRoot,zModes],[sRoot,sModes]]){
     const item=btns.find(b=>b.dataset.mode===mode);
     if(item)item.click();
   }
   const radio=menu.querySelector('input[name=u-color][value='+mode+']');if(radio)radio.checked=true;
  }
  function setSnap(checked){
   snap.checked=checked;
   if((snapButton.getAttribute('aria-pressed')==='true')!==checked)snapButton.click();
  }
  function changeMode(mode){
    if(mode!==active){active=mode;paneZ.hidden=mode!=='z';paneS.hidden=mode!=='s';}
    for(const m of ['z','s']){
      const tab=document.getElementById('u-tab-'+m);
      tab.setAttribute('aria-selected',String(m===mode));tab.tabIndex=m===mode?0:-1;
    }
    const instance=(mode==='z'?zRoot:sRoot);
    // Resuming a previously hidden canvas triggers an accurate viewport redraw.
    requestAnimationFrame(()=>{instance.__resumeHurwitz?.();window.dispatchEvent(new Event('resize'));});
  }
  document.getElementById('u-tab-z').addEventListener('click',()=>changeMode('z'));
  document.getElementById('u-tab-s').addEventListener('click',()=>changeMode('s'));
  for(const tab of [document.getElementById('u-tab-z'),document.getElementById('u-tab-s')]){
    tab.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();changeMode(e.key==='ArrowLeft'?'z':'s');document.getElementById('u-tab-'+active).focus();}});
  }
  function showSettings(show){menu.hidden=!show;settings.setAttribute('aria-expanded',String(show));}
  settings.addEventListener('click',()=>showSettings(menu.hidden));
  document.addEventListener('pointerdown',e=>{if(!menu.hidden&&!menu.contains(e.target)&&!settings.contains(e.target))showSettings(false);});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!menu.hidden){showSettings(false);settings.focus();}});
  markings.addEventListener('change',()=>setMarkings(markings.checked));
  menu.querySelectorAll('input[name=u-color]').forEach(x=>x.addEventListener('change',()=>{if(x.checked)setColor(x.value);}));
  snap.addEventListener('change',()=>setSnap(snap.checked));
  // Defaults deliberately minimalist: no overlays, Combined palette, no snap lock.
  setMarkings(false);setColor('combined');setSnap(false);changeMode('z');
})();

  state.centerY=clamp(state.centerY,Math.min(minY,maxY),Math.max(minY,maxY));
 }
 function setView(zoom,worldAnchor,px,py){
  state.zoom=clamp(zoom,0,MAX_ZOOM);
  const {w,h}=sizeCSS(),pitch=2*HALF_HEIGHT*Math.pow(10,-state.zoom)/h;
  state.centerX=worldAnchor.re-(px-w/2)*pitch;
  state.centerY=worldAnchor.im+(py-h/2)*pitch;
  clampCenter();interact();
 }
 function interact(){
  lowRes=true;
  clearTimeout(settleTimer);
  settleTimer=setTimeout(()=>{lowRes=false;schedule();},170);
  schedule();
 }
 function drawGuides(){
  if(!state.markings){svg.replaceChildren();return;}
  const {w,h}=sizeCSS(),q=pitchCSS();if(w<1||h<1)return;
  let html='';
  const ay=h/2+state.centerY/q;
  if(ay>-8&&ay<h+8){html+=`<line x1="0" y1="${ay.toFixed(2)}" x2="${w}" y2="${ay.toFixed(2)}" stroke="#f1f4fc" stroke-opacity=".20" stroke-width=".75"/>`;}
  const xlo=state.centerX-w*q/2,xhi=state.centerX+w*q/2;
  const lo=Math.max(-10,Math.ceil(xlo)),hi=Math.min(0,Math.floor(xhi));
  let step=1;
  if(q>0)step=Math.max(1,Math.ceil(34*q));
  for(let n=lo;n<=hi;n++){
   if((Math.abs(n)%step)!==0)continue;
   const px=w/2+(n-state.centerX)/q;
   if(px<8||px>w-8||ay<8||ay>h-14)continue;
   html+=`<circle cx="${px.toFixed(2)}" cy="${ay.toFixed(2)}" r="2" fill="#152632" stroke="#ffffff" stroke-opacity=".65" stroke-width=".85"/>`;
   html+=`<text x="${(px+4).toFixed(2)}" y="${(ay+13).toFixed(2)}" font-size="11" fill="#f7fafc" fill-opacity=".7" stroke="#283846" stroke-width="1.6" paint-order="stroke">${n===0?'0':'−'+Math.abs(n)}</text>`;
  }
  if(!isIntegerOrder() && ay>-1&&ay<h+1){
   const limit=Math.min(w,w/2+(-state.centerX)/q);
   if(limit>0)html+=`<line x1="0" y1="${ay.toFixed(2)}" x2="${limit}" y2="${ay.toFixed(2)}" stroke="#fff0c4" stroke-opacity=".8" stroke-width="1.7" stroke-dasharray="5 4"/>`;
  }
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.innerHTML=html;
 }
 function showMarker(){
  if(!state.probe){pin.style.display='none';return;}
  const pt=positionOf(state.probe),{w,h}=sizeCSS();
  if(pt.x<-5||pt.y<-5||pt.x>w+5||pt.y>h+5){pin.style.display='none';return;}
  pin.style.display='block';pin.style.left=`${pt.x}px`;pin.style.top=`${pt.y}px`;
 }
 function fmtReal(v){if(!Number.isFinite(v))return String(v);if(v===0)return '0';const a=Math.abs(v);if(a>=1e5||a<1e-4)return v.toExponential(4);return Number(v.toPrecision(7)).toString();}
 function fmtComplex(z){
  const a=fmtReal(z.re),b=fmtReal(Math.abs(z.im));
  return `${a} ${z.im<0?'−':'+'} ${b}i`;
 }
 function updateProbe(){
  showMarker();if(!state.probe){probeEl.style.display='none';return;}
  probeEl.style.display='flex';
  zEl.textContent=fmtComplex(state.probe);
  const val=HurwitzCore.evaluate(state.s,state.probe);
  if(val.kind==='pole'){fEl.textContent='Pole (undefined)';return;}
  if(val.kind==='branch-point'){fEl.textContent='Algebraic branch point';return;}
  if(val.kind==='branch-cut'){fEl.textContent='On the selected Hurwitz ζ branch cut';return;}
  const magnitude=Math.hypot(val.re,val.im);
  if(magnitude<1e-5||magnitude>1e6){
   if(magnitude===0){fEl.textContent='0';return;}
   fEl.textContent=`|f| = 10^(${fmtReal(val.logAbs/Math.LN10)}), arg = ${fmtReal(val.arg)} rad`;
  }else fEl.textContent=fmtComplex(val);
 }
 function updateLabels(){
  const zoom=Math.pow(10,state.zoom);
  zoomText.textContent=(state.zoom>=2.999?'1,000':zoom<10?zoom.toFixed(state.zoom<.04?0:1):Math.round(zoom).toLocaleString('en-US'))+'×';
  valueText.textContent=state.s.toFixed(2);
  let caption;
  if(isIntegerOrder()){
    const n=Math.round(state.s);
    caption=`${relation[n]||'Integer order'} · poles of order ${n} at 0, −1, −2, …`;
  } else caption=`Fractional order ${state.s.toFixed(2)} · branch points at 0, −1, −2, …`;
  description.textContent=caption;
  presets.forEach(b=>b.setAttribute('aria-pressed',String(Math.abs(Number(b.dataset.s)-state.s)<1e-8)));
 }
 function resize(){
  const {w:cssW,h:cssH}=sizeCSS();if(cssW<1||cssH<1)return false;
  const maxW=glReady?(lowRes?540:1220):(lowRes?270:550),maxH=glReady?(lowRes?530:900):(lowRes?290:590);
  const dpr=Math.min(window.devicePixelRatio||1,lowRes?1.0:1.55);
  let w=cssW*dpr,h=cssH*dpr,scale=Math.min(1,maxW/w,maxH/h);
  w=Math.max(2,Math.round(w*scale));h=Math.max(2,Math.round(h*scale));
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;return true;}
  return false;
 }
 function shadeCPU(x,y,pitch){
  const val=HurwitzCore.evaluate(state.s,{re:x,im:y});
  if(val.kind!=='finite')return [108,110,120];
  const q=clamp(val.logAbs,-200,200)/LOG_PERIOD+.5;
  const saw=frac(q),aa=.02;
  const softened=saw>1-aa?saw-smoothstep(1-aa,1,saw):saw;
  const tone=1.09-.36*softened,base=paletteSample(val.arg);
  const nearest=clamp(Math.round(-x),0,10),dist=Math.hypot(x+nearest,y);
  const dphi=pitch*state.s/Math.max(dist,1e-8);
  const clear=1-smoothstep(.75,2.4,dphi);
  return base.map((v,i)=>v*tone*clear+[145,153,163][i]*(1-clear));
 }
 function renderCPU(){
  const serial=++fbToken;
  const g=ctx||(ctx=canvas.getContext('2d',{alpha:false}));
  const w=canvas.width,h=canvas.height,pitch=2*HALF_HEIGHT*Math.pow(10,-state.zoom)/h;
  const img=g.createImageData(w,h),data=img.data;
  let yy=0;
  function rows(){
   if(stopped||serial!==fbToken)return;
   const t0=performance.now(),yStart=yy;
   while(yy<h && performance.now()-t0<12){
    for(let xx=0;xx<w;xx++){
     const x=state.centerX+(xx+.5-w/2)*pitch;
     const y=state.centerY+(h/2-yy-.5)*pitch;
     const col=shadeCPU(x,y,pitch),i=4*(yy*w+xx);
     data[i]=col[0];data[i+1]=col[1];data[i+2]=col[2];data[i+3]=255;
    }
    yy++;
   }
   g.putImageData(img,0,0,0,yStart,w,yy-yStart);
   if(yy<h)requestAnimationFrame(rows);
  }
  requestAnimationFrame(rows);
 }
 function render(){
  raf=0;if(stopped)return;
  resize();
  if(glReady){
   const {w,h}=sizeCSS(),worldMin=state.centerX-(w/h)*HALF_HEIGHT*Math.pow(10,-state.zoom);
   const N=clamp(Math.ceil(18-worldMin),0,46),anchor=Math.round(state.centerX);
   gl.viewport(0,0,canvas.width,canvas.height);gl.useProgram(program);
   gl.uniform2f(u.resolution,canvas.width,canvas.height);
   gl.uniform2f(u.local_center,state.centerX-anchor,state.centerY);
   gl.uniform1f(u.pitch,2*HALF_HEIGHT*Math.pow(10,-state.zoom)/canvas.height);
   gl.uniform1f(u.log_period,LOG_PERIOD);
   gl.uniform1i(u.anchor,anchor);gl.uniform1i(u.N,N);gl.uniform1f(u.s,state.s);gl.uniform1i(u.s_integer,isIntegerOrder()?1:0);
   gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  } else renderCPU();
  drawGuides();showMarker();updateLabels();
 }
 function schedule(){if(!raf&&!stopped)raf=requestAnimationFrame(render);}
 function cancelAnimation(){if(anim){cancelAnimationFrame(anim);anim=0;}}
 function animatedView(targetZoom,targetWorld,px,py){
  cancelAnimation();const start=performance.now(),duration=320;
  const z0=state.zoom,z1=clamp(targetZoom,0,MAX_ZOOM);
  const p0=pointAt(px,py);
  const world={re:targetWorld?.re??p0.re,im:targetWorld?.im??p0.im};
  const center0={re:state.centerX,im:state.centerY};
  function step(now){
   const q=clamp((now-start)/duration,0,1),e=q*q*(3-2*q);
   if(targetWorld){
    state.zoom=z0+(z1-z0)*e;
    state.centerX=center0.re+(targetWorld.re-center0.re)*e;
    state.centerY=center0.im+(targetWorld.im-center0.im)*e;
    clampCenter();interact();
   }else setView(z0+(z1-z0)*e,world,px,py);
   if(q<1)anim=requestAnimationFrame(step);else anim=0;
  }
  anim=requestAnimationFrame(step);
 }
 markingsToggle.addEventListener('change',()=>{
  state.markings=markingsToggle.checked;
  drawGuides();
 });
 function chooseOrder(v){
  state.s=clamp(Math.round(Number(v)*100)/100,1.5,4.5);
  slider.value=String(state.s);updateLabels();updateProbe();interact();
 }
 slider.addEventListener('input',()=>chooseOrder(slider.value));
 presets.forEach(button=>button.addEventListener('click',()=>chooseOrder(button.dataset.s)));
 root.querySelector('.pg-zoom').addEventListener('click',()=>{
  cancelAnimation();const {w,h}=sizeCSS();
  // Reset both position and magnification.
  animatedView(0,{re:-1.5,im:0},w/2,h/2);
 });
 root.querySelector('.pg-close').addEventListener('click',()=>{state.probe=null;updateProbe();});
 canvas.addEventListener('wheel',e=>{
  e.preventDefault();cancelAnimation();const rect=canvas.getBoundingClientRect();
  const x=e.clientX-rect.left,y=e.clientY-rect.top;
  const world=pointAt(x,y),delta=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?220:1);
  setView(state.zoom-delta*(e.ctrlKey?.0026:.00135),world,x,y);
 },{passive:false});
 const pointers=new Map();let startGesture=null,lastTap=null,pendingTap=null,wasMulti=false;
 const length=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
 function screen(e){const r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
 function clearTap(){if(pendingTap!==null){clearTimeout(pendingTap);pendingTap=null;}}
 canvas.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  e.preventDefault();canvas.setPointerCapture(e.pointerId);cancelAnimation();
  const p=screen(e);
  pointers.set(e.pointerId,{...p,x0:p.x,y0:p.y,t:performance.now(),type:e.pointerType});
  if(pointers.size===1){
   startGesture={cx:state.centerX,cy:state.centerY,zoom:state.zoom,world:pointAt(p.x,p.y),start:p};wasMulti=false;
  }
  if(pointers.size===2){
   clearTap();lastTap=null;wasMulti=true;
   const [a,b]=[...pointers.values()],mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
   startGesture={zoom:state.zoom,world:pointAt(mid.x,mid.y),distance:Math.max(1,length(a,b))};
  }
 });
 canvas.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;
  const p=screen(e),a=pointers.get(e.pointerId);a.x=p.x;a.y=p.y;
  if(pointers.size===2){
   const [p1,p2]=[...pointers.values()],mid={x:(p1.x+p2.x)/2,y:(p1.y+p2.y)/2};
   setView(startGesture.zoom+Math.log10(Math.max(1,length(p1,p2))/startGesture.distance),startGesture.world,mid.x,mid.y);
  }else if(!wasMulti && pointers.size===1 && length(a,{x:a.x0,y:a.y0})>4){
   setView(startGesture.zoom,startGesture.world,p.x,p.y);
   clearTap();lastTap=null;
  }
 });
 function finish(e,cancelled){
  const a=pointers.get(e.pointerId);if(!a)return;
  const p=screen(e),now=performance.now(),moved=length(p,{x:a.x0,y:a.y0});
  if(!cancelled && pointers.size===1 && !wasMulti && moved<10 && now-a.t<420){
   if(lastTap && now-lastTap.time<340 && length(lastTap,p)<42 && lastTap.type===a.type){
    clearTap();lastTap=null;const world=pointAt(p.x,p.y);
    animatedView(state.zoom+Math.log10(2),null,p.x,p.y);
   }else{
    lastTap={...p,time:now,type:a.type};clearTap();
    const world=pointAt(p.x,p.y);
    pendingTap=setTimeout(()=>{
     state.probe=world;pendingTap=null;updateProbe();
    },350);
   }
  }
  pointers.delete(e.pointerId);
  if(pointers.size===0){wasMulti=false;startGesture=null;}
  else if(pointers.size===1){
   const other=[...pointers.values()][0];
   startGesture={zoom:state.zoom,world:pointAt(other.x,other.y),start:{x:other.x,y:other.y}};
  }
 }
 canvas.addEventListener('pointerup',e=>finish(e,false));
 canvas.addEventListener('pointercancel',e=>finish(e,true));
 canvas.addEventListener('dblclick',e=>e.preventDefault());
 canvas.addEventListener('keydown',e=>{
  const {w,h}=sizeCSS(),x=w/2,y=h/2;
  if(e.key==='+'||e.key==='='){e.preventDefault();animatedView(state.zoom+Math.log10(2),null,x,y);}
  else if(e.key==='-'||e.key==='_'){e.preventDefault();animatedView(state.zoom-Math.log10(2),null,x,y);}
  else if(e.key==='Home'||e.key==='0'){e.preventDefault();root.querySelector('.pg-zoom').click();}
 });
 const ro=typeof ResizeObserver!=='undefined'?new ResizeObserver(schedule):null;
 ro?.observe(frameEl);
 const windowResize=()=>schedule();window.addEventListener('resize',windowResize);
 canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();glReady=false;});
 canvas.addEventListener('webglcontextrestored',()=>{initGL();schedule();});
 initGL();schedule();updateProbe();
 if(typeof invalidation!=='undefined')invalidation.then(()=>{
  stopped=true;cancelAnimation();clearTimeout(settleTimer);clearTap();
  if(raf)cancelAnimationFrame(raf);ro?.disconnect();window.removeEventListener('resize',windowResize);
 });
}

</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f4">
<title>Two paths to ζ(s) — discrete orbits (v2)</title>
<style>
:root { color-scheme:light; --bg:#f7f7f4; --ink:#20282c; --muted:#69757d; --line:#d9e0e0; --blue:#32799b; --rust:#b7704c; --panel:#fff; }
* { box-sizing:border-box; }
html,body {margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
#app {height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:1120px;margin:0 auto;padding:0 clamp(10px,2.5vw,24px);}
header {display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:62px;padding:13px 2px 8px;border-bottom:1px solid var(--line);flex-shrink:0;}
.brand {font-size:clamp(17px,1.7vw,21px);font-weight:640;letter-spacing:-.035em;white-space:nowrap;}
.math {font-family:Cambria,"Times New Roman",serif;font-style:italic;font-weight:400;}
.mathrm {font-family:Cambria,"Times New Roman",serif;font-style:normal;}
.brand .math {font-size:1.16em;}
#sValue {font-family:Cambria,"Times New Roman",serif;font-size:clamp(16px,1.7vw,20px);white-space:nowrap;font-variant-numeric:tabular-nums;}
#workspace {min-height:0;flex:1;display:flex;gap:20px;padding:12px 0 8px;}
#selectorPanel {width:min(30%,275px);min-width:212px;display:flex;flex-direction:column;gap:5px;}
#orbitPanel {flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:5px;}
.panelHead {min-height:28px;display:flex;gap:10px;align-items:center;justify-content:space-between;}
.panelHead .heading {font-size:14px;font-weight:640;letter-spacing:.012em;}
.panelHead .subtle {font-size:12px;color:var(--muted);}
.chart {background:var(--panel);border:1px solid #e7ebea;border-radius:12px;min-width:0;min-height:0;position:relative;overflow:hidden;}
.chart canvas {display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;}
#sCanvas {cursor:crosshair;}
#orbitCanvas {cursor:grab;}
#orbitCanvas:active {cursor:grabbing;}
#sFrame {height:min(37vh,290px);flex-shrink:0;}
#orbitFrame {flex:1;min-height:150px;}
#selectorHint {font-size:12px;color:var(--muted);padding:2px 4px;line-height:1.35;}
.legend {display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:flex-start;}
.legendItem {display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);white-space:nowrap;}
.legendStroke {display:inline-block;width:17px;height:0;border-top:2.5px solid var(--blue);border-radius:3px;}
.legendStroke.rust {border-color:var(--rust);}
#fitButton {border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;min-height:31px;color:var(--ink);font-size:12px;cursor:pointer;}
#fitButton:focus-visible,#cutoff:focus-visible {outline:2px solid var(--blue);outline-offset:2px;}
#plotFoot {display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:36px;padding:0 3px;}
#plotFoot .subtle {font-size:12px;color:var(--muted);}
#limitValue {font-family:Cambria,"Times New Roman",serif;font-size:clamp(14px,1.25vw,17px);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;}
.guideControls {display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:12px;color:var(--muted);}
#guideMode {border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);padding:6px 20px 6px 7px;font:inherit;max-width:150px;min-height:32px;cursor:pointer;}
#guideMode:focus-visible {outline:2px solid var(--blue);outline-offset:2px;}
#footer {flex-shrink:0;border-top:1px solid var(--line);padding:11px 2px 13px;display:flex;flex-direction:column;gap:7px;}
#cutoffRow,#counts {display:flex;justify-content:space-between;align-items:center;gap:12px;}
#cutoffRow .name {font-size:14px;font-weight:620;}
#nValue {font-size:18px;font-variant-numeric:tabular-nums;font-weight:680;}
#cutoff {width:100%;margin:0;height:23px;accent-color:var(--blue);cursor:pointer;touch-action:pan-y;}
#counts {font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;}
#counts strong {color:var(--ink);font-weight:620;}
#mathNote {font-size:12px;color:var(--muted);text-align:center;line-height:1.35;}
@media(max-width:680px) {
  #app {padding:0 10px;}
  header {min-height:54px;padding:9px 2px 7px;}
  .brand {font-size:17px;}
  #sValue {font-size:17px;}
  #workspace {flex-direction:column;gap:8px;padding:7px 0 7px;}
  #selectorPanel {width:100%;min-width:0;gap:3px;}
  .panelHead {min-height:23px;}
  .panelHead .heading {font-size:13px;}
  #sFrame {height:clamp(104px,17.5dvh,150px);}
  #selectorHint {display:none;}
  #orbitPanel {flex:1;gap:3px;}
  #orbitFrame {min-height:120px;}
  .legendItem {font-size:12px;}
  .legend {gap:8px;}
  #fitButton {min-height:28px;padding:4px 9px;}
  #plotFoot {gap:6px;min-height:34px;}
  #limitValue {font-size:14px;}
  .guideControls {font-size:12px;}
  #guideMode {max-width:132px;padding:5px 15px 5px 5px;min-height:32px;}
  #plotFoot .subtle {font-size:11px;}
  #footer {padding:9px 2px max(12px,env(safe-area-inset-bottom));gap:5px;}
  #cutoffRow .name {font-size:14px;}
  #nValue {font-size:18px;}
  #counts {font-size:12px;}
  #mathNote {display:block;font-size:11px;line-height:1.3;padding:0 4px;}
}
@media(max-height:610px) and (max-width:680px) {
 #sFrame {height:100px;}
 header {min-height:48px;}
 #footer {padding-top:6px;gap:3px;}
}
@media(prefers-reduced-motion:reduce) { * {scroll-behavior:auto!important;} }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Two paths to <span class="math">ζ(s)</span></div>
    <div id="sValue" aria-live="off">s = 1.50 + 6.00i</div>
  </header>
  <main id="workspace">
    <section id="selectorPanel" aria-label="Choose a complex exponent">
      <div class="panelHead"><span class="heading">Choose <span class="math">s = σ + it</span></span><span class="subtle">σ &gt; 1</span></div>
      <div class="chart" id="sFrame"><canvas id="sCanvas" aria-label="Drag to choose a complex exponent s, with real part between 1.15 and 3 and imaginary part between 0 and 20"></canvas></div>
      <div id="selectorHint">Drag the point to change the complex exponent.</div>
    </section>
    <section id="orbitPanel" aria-label="Orbits in the complex zeta plane">
      <div class="panelHead"><div class="legend"><span class="legendItem"><span class="legendStroke"></span>Dirichlet series</span><span class="legendItem"><span class="legendStroke rust"></span>Euler product</span></div><button id="fitButton" type="button" title="Refit both orbits">Fit</button></div>
      <div class="chart" id="orbitFrame"><canvas id="orbitCanvas" aria-label="Complex plane showing partial sums and partial products converging toward zeta of s"></canvas></div>
      <div id="plotFoot"><output id="limitValue" aria-label="Limiting zeta value">ζ(s) ≈ —</output><label class="guideControls" for="guideMode">Guides <select id="guideMode" aria-label="Diagnostic scale guides">
        <option value="axes" selected>Crosshair</option><option value="grid">Grid</option><option value="bar">Scale bar</option>
        <option value="axesbar">Cross + bar</option><option value="gridbar">Grid + bar</option><option value="none">None</option>
      </select></label></div>
    </section>
  </main>
  <footer id="footer">
    <div id="cutoffRow"><span class="name">Shared cutoff <span class="math">N</span></span><output id="nValue" for="cutoff">250</output></div>
    <input id="cutoff" type="range" min="0" max="1000" value="600" step="1" aria-label="Integer cutoff N from 1 to 10000 on a logarithmic scale">
    <div id="counts"><span>Series: <strong id="termCount">250</strong> terms</span><span>Product: <strong id="primeCount">53</strong> primes</span></div>
    <div id="mathNote">Dots mark the discrete partial sums and products; smooth connecting paths only guide the eye.</div>
  </footer>
</div>
<script>
(()=>{'use strict';
const MAX_N=10000;
const COLOR={blue:'#32799b',rust:'#b7704c',ink:'#263039',muted:'#78858b',axis:'#d5dcdb',grid:'#eff1ee',pole:'#ffffff'};
const logs=new Float64Array(MAX_N+1);for(let n=1;n<=MAX_N;n++)logs[n]=Math.log(n);
// Sieve of Eratosthenes: generated locally, no external data or service.
const sieve=new Uint8Array(MAX_N+1);sieve.fill(1,2);
for(let p=2;p*p<=MAX_N;p++)if(sieve[p])for(let m=p*p;m<=MAX_N;m+=p)sieve[m]=0;
const primes=[];const primePrefix=new Uint16Array(MAX_N+1);let pc=0;
for(let n=1;n<=MAX_N;n++){if(sieve[n]){primes.push(n);pc++;}primePrefix[n]=pc;}
const $=id=>document.getElementById(id);
const sCanvas=$('sCanvas'),orbitCanvas=$('orbitCanvas'),slider=$('cutoff');
const sc=sCanvas.getContext('2d'),oc=orbitCanvas.getContext('2d');
const guideSelect=$('guideMode');let guideMode=guideSelect.value;
guideSelect.addEventListener('change',()=>{guideMode=guideSelect.value;drawW();});
const exponent={re:1.5,im:6};
let Sre=new Float64Array(MAX_N+1),Sim=new Float64Array(MAX_N+1),Pre=new Float64Array(primes.length+1),Pim=new Float64Array(primes.length+1);
let zeta={re:0,im:0}, nCutoff=250, showN=250,traceAnim=0,pressS=null, orbitPointers=new Map(),panning=null,dragMoved=false;
let wCamera={cx:0,cy:0,span:1}; // span = horizontal world units across the plot
let canvasW={w:1,h:1},canvasS={w:1,h:1};
const prefersReduced=window.matchMedia('(prefers-reduced-motion: reduce)');
const twopi=Math.PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const powN=v=>Math.max(1,Math.min(MAX_N,Math.round(Math.exp(v/1000*Math.log(MAX_N)))));
const toSlider=n=>Math.round(1000*Math.log(Math.max(1,n))/Math.log(MAX_N));
const cmul=(a,b)=>({re:a.re*b.re-a.im*b.im,im:a.re*b.im+a.im*b.re});
const cpowNeg=(sigma,t,ln)=>{const m=Math.exp(-sigma*ln),a=-t*ln;return {re:m*Math.cos(a),im:m*Math.sin(a)};};
function zetaEulerMaclaurin(sigma,t){
 // Independent ζ(s) reference: Euler–Maclaurin, never the slider's truncated sum/product.
 // ζ(s) = sum_{n=1}^{M-1} n^-s + M^(1-s)/(s-1) + M^-s/2
 //       + sum B_2k/(2k)! (s)_(2k-1) M^(-s-2k+1).
 const M=200,bern=[1/12,-1/720,1/30240,-1/1209600,5/239500800,-691/1307674368000,7/523069747200];
 let re=0,im=0;
 for(let n=1;n<M;n++){const q=cpowNeg(sigma,t,logs[n]);re+=q.re;im+=q.im;}
 // M^(1-s)/(s-1)
 const u=cpowNeg(sigma,t,Math.log(M));const a=sigma-1,b=t,den=a*a+b*b;
 re+= M*(u.re*a+u.im*b)/den;
 im+= M*(u.im*a-u.re*b)/den;
 re+=u.re/2;im+=u.im/2;
 let rise={re:1,im:0},q={re:u.re/M,im:u.im/M};
 for(let k=1;k<=bern.length;k++){
   // Extend (s)_(2k-1) by 1 factor for k=1, then 2 for each subsequent k.
   const lo=(k===1?0:2*k-3),hi=2*k-2;
   for(let j=lo;j<=hi;j++)rise=cmul(rise,{re:sigma+j,im:t});
   const coeff=bern[k-1];re+=coeff*(rise.re*q.re-rise.im*q.im);im+=coeff*(rise.re*q.im+rise.im*q.re);
   q={re:q.re/(M*M),im:q.im/(M*M)};
 }
 return {re,im};
}
function calculate(){
 let sr=0,si=0,pr=1,pi=0;
 Pre[0]=1;Pim[0]=0;
 let idx=0;
 for(let n=1;n<=MAX_N;n++){
   const q=cpowNeg(exponent.re,exponent.im,logs[n]);
   sr+=q.re;si+=q.im;Sre[n]=sr;Sim[n]=si;
   if(sieve[n]){
     const dr=1-q.re,di=-q.im,den=dr*dr+di*di;
     const rr=dr/den,ri=-di/den;
     const nr=pr*rr-pi*ri,np=pr*ri+pi*rr;
     pr=nr;pi=np;idx++;Pre[idx]=pr;Pim[idx]=pi;
   }
 }
 zeta=zetaEulerMaclaurin(exponent.re,exponent.im);
}
function wToScreen(x,y){const scale=canvasW.w/wCamera.span;return {x:canvasW.w/2+(x-wCamera.cx)*scale,y:canvasW.h/2-(y-wCamera.cy)*scale};}
function screenToW(x,y){const scale=canvasW.w/wCamera.span;return {re:wCamera.cx+(x-canvasW.w/2)/scale,im:wCamera.cy-(y-canvasW.h/2)/scale};}
function fitCamera(){
 let xmin=Math.min(1,zeta.re),xmax=Math.max(1,zeta.re),ymin=Math.min(0,zeta.im),ymax=Math.max(0,zeta.im);
 for(let n=1;n<=MAX_N;n++){xmin=Math.min(xmin,Sre[n]);xmax=Math.max(xmax,Sre[n]);ymin=Math.min(ymin,Sim[n]);ymax=Math.max(ymax,Sim[n]);}
 for(let k=0;k<=primes.length;k++){xmin=Math.min(xmin,Pre[k]);xmax=Math.max(xmax,Pre[k]);ymin=Math.min(ymin,Pim[k]);ymax=Math.max(ymax,Pim[k]);}
 const xs=xmax-xmin,ys=ymax-ymin,ratio=canvasW.h/canvasW.w;
 const width=Math.max(xs*1.29,ys/Math.max(.18,ratio)*1.29,0.095);
 wCamera={cx:(xmin+xmax)/2,cy:(ymin+ymax)/2,span:width};
}
function resize(canvas,ctx){
 const rect=canvas.getBoundingClientRect(),w=Math.max(1,rect.width),h=Math.max(1,rect.height),dpr=Math.min(window.devicePixelRatio||1,3);
 canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);return {w,h};
}
function resizeAll(){canvasS=resize(sCanvas,sc);canvasW=resize(orbitCanvas,oc);fitCamera();draw();}
function paintLabel(ctx,txt,x,y,color=COLOR.muted,align='center',size=12){ctx.fillStyle=color;ctx.font=`${size}px system-ui,Segoe UI,sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(txt,x,y);}
function drawSelector(){
 const c=sc,W=canvasS.w,H=canvasS.h;c.clearRect(0,0,W,H);
 const box={l:46,r:W-20,t:14,b:H-24};box.r=Math.max(box.l+50,box.r);box.b=Math.max(box.t+45,box.b);
 const sx=x=>box.l+(x-1)/(3.05-1)*(box.r-box.l);
 const sy=y=>box.b-y/20*(box.b-box.t);
 c.fillStyle='#f3f8f8';c.fillRect(box.l,box.t,box.r-box.l,box.b-box.t);
 c.strokeStyle='#d5dddb';c.lineWidth=1;c.beginPath();c.moveTo(box.l,box.t);c.lineTo(box.l,box.b);c.lineTo(box.r,box.b);c.stroke();
 c.setLineDash([3,4]);c.strokeStyle='#d6e3e5';c.beginPath();c.moveTo(sx(2),box.t);c.lineTo(sx(2),box.b);c.moveTo(box.l,sy(10));c.lineTo(box.r,sy(10));c.stroke();c.setLineDash([]);
 for(const v of [1,2,3])paintLabel(c,String(v),sx(v),H-12,COLOR.muted,'center',11);
 for(const v of [0,10,20])paintLabel(c,String(v),box.l-9,sy(v),COLOR.muted,'right',11);
 paintLabel(c,'t',13,H/2,COLOR.muted,'center',12);paintLabel(c,'σ',W-11,13,COLOR.muted,'right',13);
 const px=sx(exponent.re),py=sy(exponent.im);c.strokeStyle='#87aab7';c.lineWidth=1;c.setLineDash([3,4]);c.beginPath();c.moveTo(px,box.b);c.lineTo(px,py);c.lineTo(box.l,py);c.stroke();c.setLineDash([]);
 c.beginPath();c.arc(px,py,8,0,twopi);c.fillStyle='white';c.fill();c.strokeStyle=COLOR.blue;c.lineWidth=3;c.stroke();
 c.beginPath();c.arc(px,py,3.8,0,twopi);c.fillStyle=COLOR.blue;c.fill();
 c._selectorBox=box;
}
function selectorPoint(e){const r=sCanvas.getBoundingClientRect(),b=sc._selectorBox,x=e.clientX-r.left,y=e.clientY-r.top;
 return {re:clamp(1+(x-b.l)/(b.r-b.l)*(3.05-1),1.15,3),im:clamp(20*(b.b-y)/(b.b-b.t),0,20)};
}
function setExponent(re,im){const a=clamp(re,1.15,3),b=clamp(im,0,20);if(Math.abs(a-exponent.re)<1e-5&&Math.abs(b-exponent.im)<1e-5)return;
 exponent.re=a;exponent.im=b;cancelTrace();calculate();fitCamera();updateReadouts();draw();}
function updateReadouts(){const sign=exponent.im>=0?'+':'−';$('sValue').textContent=`s = ${exponent.re.toFixed(2)} ${sign} ${Math.abs(exponent.im).toFixed(2)}i`;
 const zsign=zeta.im>=0?'+':'−';$('limitValue').textContent=`ζ(s) ≈ ${zeta.re.toFixed(3)} ${zsign} ${Math.abs(zeta.im).toFixed(3)}i`;
 $('nValue').textContent=nCutoff.toLocaleString('en-US');$('termCount').textContent=nCutoff.toLocaleString('en-US');$('primeCount').textContent=primePrefix[nCutoff].toLocaleString('en-US');}
function screenPositions(ar,ai,n,from=0){const a=[];for(let i=from;i<=n;i++)a.push(wToScreen(ar[i],ai[i]));return a;}
function drawSpline(c,points,showStyle){
 if(points.length<2)return;
 // Centripetal Catmull–Rom knot spacing (alpha = 1/2), converted to cubic Beziers.
 // Only the discrete point positions are mathematically defined: the curve is a visual guide.
 const n=points.length;const knots=new Float64Array(n);for(let i=1;i<n;i++)knots[i]=knots[i-1]+Math.max(1e-8,Math.sqrt(Math.hypot(points[i].x-points[i-1].x,points[i].y-points[i-1].y)));
 const tx=new Float64Array(n),ty=new Float64Array(n);
 for(let i=0;i<n;i++){
   if(i===0||i===n-1){const a=i===0?0:n-2,b=a+1,dt=knots[b]-knots[a];tx[i]=(points[b].x-points[a].x)/dt;ty[i]=(points[b].y-points[a].y)/dt;}
   else {const a=knots[i]-knots[i-1],b=knots[i+1]-knots[i],d=a+b;
     tx[i]=((points[i].x-points[i-1].x)/a*b+(points[i+1].x-points[i].x)/b*a)/d;
     ty[i]=((points[i].y-points[i-1].y)/a*b+(points[i+1].y-points[i].y)/b*a)/d;
   }
 }
 c.beginPath();c.moveTo(points[0].x,points[0].y);
 for(let i=0;i<n-1;i++){
   const p=points[i],q=points[i+1],dt=knots[i+1]-knots[i],seg=Math.hypot(q.x-p.x,q.y-p.y),maxHandle=.55*seg;
   let h1x=tx[i]*dt/3,h1y=ty[i]*dt/3,h2x=tx[i+1]*dt/3,h2y=ty[i+1]*dt/3;
   const lh1=Math.hypot(h1x,h1y),lh2=Math.hypot(h2x,h2y);
   if(lh1>maxHandle){h1x*=maxHandle/lh1;h1y*=maxHandle/lh1;}
   if(lh2>maxHandle){h2x*=maxHandle/lh2;h2y*=maxHandle/lh2;}
   c.bezierCurveTo(p.x+h1x,p.y+h1y,q.x-h2x,q.y-h2y,q.x,q.y);
 }
 c.save();c.globalAlpha=.57;c.strokeStyle=showStyle;c.lineWidth=1.8;c.lineJoin='round';c.lineCap='round';c.stroke();c.restore();
}
function drawDot(c,p,color,r=4.4){c.beginPath();c.arc(p.x,p.y,r,0,twopi);c.fillStyle='#fff';c.fill();c.lineWidth=2;c.strokeStyle=color;c.stroke();}
function drawOrbitPoints(c,points,color){
 // Discrete orbit positions. Keep them small and translucent; overlap naturally
 // darkens crowded tail regions. Clip off-screen dots to avoid wasted work.
 c.save();c.fillStyle=color;c.globalAlpha=.5;
 const W=canvasW.w,H=canvasW.h;
 for(let i=0;i<points.length;i++){
   const p=points[i];if(p.x < -2 || p.x>W+2 || p.y < -2 || p.y>H+2)continue;
   c.beginPath();c.arc(p.x,p.y,1.55,0,twopi);c.fill();
 }
 c.restore();
}
function niceGridStep(){
 const desired=canvasW.w>520?80:63;
 const world=desired*wCamera.span/canvasW.w;
 const base=Math.pow(10,Math.floor(Math.log10(world)));
 return [1,2,5,10].map(n=>n*base).reduce((a,b)=>Math.abs(Math.log(a/world))<Math.abs(Math.log(b/world))?a:b);
}
function drawGuides(c,W,H){
 if(guideMode==='none'||guideMode==='bar')return;
 const showGrid=guideMode==='grid'||guideMode==='gridbar';
 if(showGrid){
   const step=niceGridStep();
   const left=screenToW(0,0).re,right=screenToW(W,0).re;
   const top=screenToW(0,0).im,bottom=screenToW(0,H).im;
   c.save();c.beginPath();c.strokeStyle='#e9edeb';c.lineWidth=.8;
   const ix0=Math.ceil(left/step),ix1=Math.floor(right/step);
   for(let i=ix0;i<=ix1;i++){
     if(i===0)continue;
     const x=wToScreen(i*step,0).x;c.moveTo(x,0);c.lineTo(x,H);
   }
   const iy0=Math.ceil(bottom/step),iy1=Math.floor(top/step);
   for(let i=iy0;i<=iy1;i++){
     if(i===0)continue;
     const y=wToScreen(0,i*step).y;c.moveTo(0,y);c.lineTo(W,y);
   }
   c.stroke();c.restore();
 }
 const zero=wToScreen(0,0);
 c.save();c.strokeStyle='#cbd4d2';c.lineWidth=1;
 c.beginPath();if(zero.x>=0&&zero.x<=W){c.moveTo(zero.x,0);c.lineTo(zero.x,H);}
 if(zero.y>=0&&zero.y<=H){c.moveTo(0,zero.y);c.lineTo(W,zero.y);}c.stroke();c.restore();
}
function drawScaleBar(c,W,H){
 if(!['bar','axesbar','gridbar'].includes(guideMode))return;
 const step=niceGridStep(),length=step*W/wCamera.span;
 const x=17,y=H-18;
 c.save();c.font='12px system-ui, sans-serif';
 const label=Number(step.toPrecision(3)).toString();
 const textWidth=c.measureText(label).width;
 c.fillStyle='rgba(255,255,255,.85)';
 c.fillRect(x-7,y-33,Math.max(length+14,textWidth+18),45);
 c.strokeStyle='#66747b';c.lineWidth=1.4;c.beginPath();
 c.moveTo(x,y);c.lineTo(x+length,y);
 c.moveTo(x,y-4);c.lineTo(x,y+4);
 c.moveTo(x+length,y-4);c.lineTo(x+length,y+4);c.stroke();
 paintLabel(c,label,x+length/2,y-15,'#53616b','center',12);
 c.restore();
}
function drawW(){
 const c=oc,W=canvasW.w,H=canvasW.h;c.clearRect(0,0,W,H);c.save();c.beginPath();c.rect(0,0,W,H);c.clip();
 const s=canvasW.w/wCamera.span;
 drawGuides(c,W,H);
 const level=Math.max(1,Math.min(MAX_N,showN));const count=primePrefix[level];
 const pSeries=screenPositions(Sre,Sim,level,1);const pProduct=screenPositions(Pre,Pim,count);
 drawSpline(c,pSeries,COLOR.blue);drawSpline(c,pProduct,COLOR.rust);
 drawOrbitPoints(c,pSeries,COLOR.blue);drawOrbitPoints(c,pProduct,COLOR.rust);
 const target=wToScreen(zeta.re,zeta.im),start=wToScreen(1,0);
 // Limiting value: neutral ring with a dark center; stays visible at every cutoff.
 c.beginPath();c.arc(target.x,target.y,6.2,0,twopi);c.fillStyle='#fff';c.fill();c.lineWidth=1.7;c.strokeStyle=COLOR.ink;c.stroke();
 c.beginPath();c.arc(target.x,target.y,1.7,0,twopi);c.fillStyle=COLOR.ink;c.fill();
 if(Math.hypot(target.x-start.x,target.y-start.y)>28){
   c.beginPath();c.arc(start.x,start.y,2.8,0,twopi);c.fillStyle=COLOR.ink;c.fill();
   paintLabel(c,'1',start.x+9,start.y+11,COLOR.muted,'left',12);
 }
 drawDot(c,pSeries[pSeries.length-1],COLOR.blue,4.4);drawDot(c,pProduct[pProduct.length-1],COLOR.rust,4.4);
 drawScaleBar(c,W,H);
 c.restore();
 paintLabel(c,'Im w',13,18,COLOR.muted,'left',12);paintLabel(c,'Re w',W-10,H-14,COLOR.muted,'right',12);
}
function draw(){drawSelector();drawW();}
function cancelTrace(){if(traceAnim){cancelAnimationFrame(traceAnim);traceAnim=0;}showN=nCutoff;}
function beginTrace(){if(prefersReduced.matches||nCutoff<=1)return;cancelTrace();const begin=performance.now(),dur=520,goal=nCutoff;
 function step(now){const t=clamp((now-begin)/dur,0,1),p=1-Math.pow(1-t,2);showN=Math.max(1,Math.min(goal,Math.round(Math.exp(Math.log(goal)*p))));drawW();if(t<1)traceAnim=requestAnimationFrame(step);else {traceAnim=0;showN=goal;drawW();}}
 traceAnim=requestAnimationFrame(step);
}
function updateCutoff(n){cancelTrace();nCutoff=clamp(n,1,MAX_N);showN=nCutoff;updateReadouts();drawW();}
slider.value=String(toSlider(nCutoff));slider.addEventListener('input',()=>updateCutoff(powN(+slider.value)));
// s-plane interaction: recompute continuously and trace briefly when the drag ends.
sCanvas.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;sCanvas.setPointerCapture(e.pointerId);pressS={x:e.clientX,y:e.clientY,moved:false};const p=selectorPoint(e);setExponent(p.re,p.im);});
sCanvas.addEventListener('pointermove',e=>{if(!pressS)return;if(Math.hypot(e.clientX-pressS.x,e.clientY-pressS.y)>3)pressS.moved=true;const p=selectorPoint(e);setExponent(p.re,p.im);});
function stopSelect(e){if(!pressS)return;const moved=pressS.moved;pressS=null;if(moved)beginTrace();}
sCanvas.addEventListener('pointerup',stopSelect);sCanvas.addEventListener('pointercancel',stopSelect);
// W-plane pan, wheel zoom, pinch zoom. No separate controls or play/pause.
const orbLoc=e=>{const r=orbitCanvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};};
function zoomAt(x,y,f){const anchor=screenToW(x,y);wCamera.span=clamp(wCamera.span/f,.003,100);const scale=canvasW.w/wCamera.span;wCamera.cx=anchor.re-(x-canvasW.w/2)/scale;wCamera.cy=anchor.im+(y-canvasW.h/2)/scale;drawW();}
orbitCanvas.addEventListener('wheel',e=>{e.preventDefault();const p=orbLoc(e);zoomAt(p.x,p.y,Math.exp(-e.deltaY*.0015));},{passive:false});
orbitCanvas.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;orbitCanvas.setPointerCapture(e.pointerId);orbitPointers.set(e.pointerId,orbLoc(e));panning=null;});
orbitCanvas.addEventListener('pointermove',e=>{if(!orbitPointers.has(e.pointerId))return;const last=orbitPointers.get(e.pointerId),now=orbLoc(e);orbitPointers.set(e.pointerId,now);
 if(orbitPointers.size===1){const scale=wCamera.span/canvasW.w;wCamera.cx-=(now.x-last.x)*scale;wCamera.cy+=(now.y-last.y)*scale;drawW();}
 else if(orbitPointers.size===2){const pts=[...orbitPointers.values()];if(!panning){panning={dist:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y),mid:{x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2}};return;}
 const dist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y),mid={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};
 if(panning.dist>3&&dist>3)zoomAt(mid.x,mid.y,dist/panning.dist);
 const scale=wCamera.span/canvasW.w;wCamera.cx-=(mid.x-panning.mid.x)*scale;wCamera.cy+=(mid.y-panning.mid.y)*scale;panning={dist,mid};drawW();}
});
function endOrbitPointer(e){orbitPointers.delete(e.pointerId);panning=null;}
orbitCanvas.addEventListener('pointerup',endOrbitPointer);orbitCanvas.addEventListener('pointercancel',endOrbitPointer);
orbitCanvas.addEventListener('dblclick',()=>{fitCamera();drawW();});$('fitButton').addEventListener('click',()=>{fitCamera();drawW();});
new ResizeObserver(()=>resizeAll()).observe($('workspace'));
calculate();updateReadouts();resizeAll();
// Read-only test seam, accessible to local automated browser checks.
window.__zetaDemo={getState:()=>({s:{...exponent},N:nCutoff,primes:primePrefix[nCutoff],zeta:{...zeta},sum:{re:Sre[nCutoff],im:Sim[nCutoff]},product:{re:Pre[primePrefix[nCutoff]],im:Pim[primePrefix[nCutoff]]},canvas:{...canvasW},camera:{...wCamera},guides:guideMode}),setS:(re,im)=>setExponent(re,im),setN:n=>{updateCutoff(n);slider.value=String(toSlider(n));},reset:()=>{fitCamera();drawW();}};
})();
</script>
